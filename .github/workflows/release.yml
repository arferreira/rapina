name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: nightly

      - name: Build
        run: cargo build --locked --release --all

      - name: Run tests
        run: cargo test --locked --all

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v2
        continue-on-error: true
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: nightly

      - name: Publish rapina-macros
        run: cargo publish -p rapina-macros --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish rapina
        run: cargo publish -p rapina --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish rapina-cli
        run: cargo publish -p rapina-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
